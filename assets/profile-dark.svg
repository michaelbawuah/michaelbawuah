<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" fill="none" role="img" aria-labelledby="title description">
  <title id="title">MBA~Steins — Michael Baffour Awuah</title>
  <desc id="description">Cornell Engineering student building AI/ML systems and software. A compact console with a floating, isometric coding chip in cyan and violet.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1000" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1524"/>
      <stop offset=".55" stop-color="#080D17"/>
      <stop offset="1" stop-color="#13152C"/>
    </linearGradient>
    <linearGradient id="edge" x1="30" y1="0" x2="970" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E2E7" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#26334A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#A393FF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="accent" x1="44" y1="90" x2="444" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76F4E8"/>
      <stop offset=".48" stop-color="#8ACBFF"/>
      <stop offset="1" stop-color="#BBA6FF"/>
    </linearGradient>
    <linearGradient id="symbol" x1="772" y1="126" x2="918" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64E5E8"/>
      <stop offset="1" stop-color="#B49CFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(846 170) rotate(90) scale(119 140)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#547BDB" stop-opacity=".15"/>
      <stop offset="1" stop-color="#547BDB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#91ABD5" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="308" rx="19"/></clipPath>

    <linearGradient id="base-plane" x1="715" y1="168" x2="942" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152A42"/><stop offset="1" stop-color="#27213F"/>
    </linearGradient>
    <linearGradient id="middle-plane" x1="730" y1="136" x2="940" y2="223" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D3C51"/><stop offset="1" stop-color="#302849"/>
    </linearGradient>
    <linearGradient id="chip-plane" x1="0" y1="0" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245463"/><stop offset="1" stop-color="#443961"/>
    </linearGradient>
    <linearGradient id="chip-edge" x1="740" y1="125" x2="934" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F1ED"/><stop offset="1" stop-color="#C4ABFF"/>
    </linearGradient>
    <radialGradient id="ground-shadow">
      <stop stop-color="#020611" stop-opacity=".65"/>
      <stop offset="1" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .cursor { animation: cursor 2s steps(2, end) infinite; }
    .signal { animation: signal 5s ease-in-out infinite; }
    .chip { animation: float 7s ease-in-out infinite; }
    @keyframes cursor { 0%, 45%, 100% { opacity: 1; } 50%, 95% { opacity: .18; } }
    @keyframes signal { 0%, 100% { opacity: .38; } 50% { opacity: .95; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .signal, .chip { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="310" fill="url(#surface)"/>
    <rect width="1000" height="310" fill="url(#grid)"/>
    <rect width="1000" height="54" fill="#FFFFFF" fill-opacity=".025"/>
    <path d="M0 54H1000" stroke="#8BA3CB" stroke-opacity=".13"/>
    <g transform="translate(31 27)">
      <circle r="4" fill="#FF7F8B" fill-opacity=".75"/>
      <circle cx="15" r="4" fill="#F5C66E" fill-opacity=".75"/>
      <circle cx="30" r="4" fill="#6ED8A8" fill-opacity=".75"/>
    </g>
    <text x="83" y="32" fill="#8B9BB5" font-family="'DejaVu Sans Mono', monospace" font-size="12">michaelbawuah / profile</text>
    <path d="M737 27H758" stroke="#698399" stroke-opacity=".55"/>
    <text x="774" y="32" fill="#A4B3CA" font-family="'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="1.1">CORNELL ENGINEERING</text>

    <text x="44" y="99" fill="#9BADCB" font-family="'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2">HELLO, WORLD.</text>
    <text x="40" y="159" fill="url(#accent)" font-family="'DejaVu Sans', Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-2.1">MBA~Steins</text>
    <text x="44" y="198" fill="#E6ECF7" font-family="'DejaVu Sans', Arial, sans-serif" font-size="22" letter-spacing=".1">Michael Baffour Awuah</text>
    <text x="44" y="231" fill="#A6B5CD" font-family="'DejaVu Sans Mono', monospace" font-size="14">AI / ML SYSTEMS + SOFTWARE ENGINEERING</text>
    <path d="M44 265L50 270L44 275" stroke="#70DDD9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="275" fill="#8394B0" font-family="'DejaVu Sans Mono', monospace" font-size="12">Build deeply. Make it useful.</text>
    <rect class="cursor" x="286" y="264" width="7" height="13" rx="1" fill="#70DDD9"/>

    <!-- Isometric planes, shaded faces, and a gently floating coding chip. -->
    <ellipse cx="837" cy="190" rx="160" ry="120" fill="url(#halo)"/>
    <ellipse cx="840" cy="276" rx="148" ry="24" fill="url(#ground-shadow)"/>
    <g stroke="#839DC9" stroke-opacity=".20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M680 180H708L731 167M903 105L926 92H962M943 249H970M706 256H738L756 246"/>
      <path d="M753 97L790 76H874L905 94" stroke-dasharray="3 7"/>
    </g>

    <!-- Bottom deck. -->
    <path d="M698 206L837 285V292L698 213Z" fill="#0C1A2B"/>
    <path d="M837 285L976 206V213L837 292Z" fill="#252541"/>
    <path d="M698 206L837 127L976 206L837 285Z" fill="url(#base-plane)" stroke="url(#chip-edge)" stroke-opacity=".28"/>
    <g stroke="url(#chip-edge)" stroke-width="1" stroke-opacity=".32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M722 207L837 272L951 207M748 201L784 221V232L817 251M926 208L890 228V239L857 258"/>
      <path d="M708 208L837 281L966 208" stroke-opacity=".18"/>
    </g>

    <!-- Suspended middle deck. -->
    <path d="M713 180L837 250V260L713 190Z" fill="#122A3D"/>
    <path d="M837 250L961 180V190L837 260Z" fill="#352A52"/>
    <path d="M713 180L837 110L961 180L837 250Z" fill="url(#middle-plane)" stroke="url(#chip-edge)" stroke-opacity=".38"/>
    <path d="M730 180L837 119L944 180L837 241Z" stroke="url(#chip-edge)" stroke-opacity=".28"/>
    <g stroke="url(#chip-edge)" stroke-width="2" stroke-linecap="round" opacity=".50">
      <path d="M732 186L746 194M750 196L764 204M768 207L782 215M786 217L800 225"/>
      <path d="M875 226L889 218M893 216L907 208M911 205L925 197M929 194L943 186"/>
    </g>
    <path d="M750 211L817 249" stroke="#79F1ED" stroke-opacity=".65" stroke-linecap="round"/>
    <path d="M857 249L924 211" stroke="#C4ABFF" stroke-opacity=".65" stroke-linecap="round"/>

    <!-- Top chip; the symbol is projected onto its square surface. -->
    <g class="chip">
      <path d="M740 146L837 201V217L740 162Z" fill="#133644"/>
      <path d="M837 201L934 146V162L837 217Z" fill="#3C2D5A"/>
      <path d="M741 162L837 216L933 162" stroke="url(#chip-edge)" stroke-opacity=".48"/>
      <g transform="matrix(.8362069 .4741379 -.8362069 .4741379 837 91)">
        <rect width="116" height="116" fill="url(#chip-plane)"/>
        <rect x=".8" y=".8" width="114.4" height="114.4" stroke="#D9F9FF" stroke-opacity=".32" stroke-width="1.1"/>
        <rect x="10" y="10" width="96" height="96" rx="5" stroke="#D9F9FF" stroke-opacity=".15"/>
        <g stroke="#D9F9FF" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M42 40L27 58L42 76M74 40L89 58L74 76"/>
          <path d="M48 63C53 48 60 48 65 58C70 68 75 67 79 54" stroke-width="3.7"/>
        </g>
        <path d="M43 93H73" stroke="#D9F9FF" stroke-opacity=".35" stroke-linecap="round"/>
        <circle cx="15" cy="15" r="2" fill="#79F1ED"/>
        <circle cx="101" cy="101" r="2" fill="#C4ABFF"/>
      </g>
      <path d="M740 146L837 91L934 146L837 201Z" stroke="url(#chip-edge)" stroke-opacity=".60" stroke-width="1.2"/>
      <path d="M763 166L822 199" stroke="#79F1ED" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
      <path d="M854 199L913 166" stroke="#C4ABFF" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Two small satellites carry the same lighting and perspective. -->
    <g>
      <path d="M945 109L959 117V133L945 125Z" fill="#122A3D"/>
      <path d="M959 117L973 109V125L959 133Z" fill="#352A52"/>
      <path d="M945 109L959 101L973 109L959 117Z" fill="#1D3C51" stroke="#79F1ED" stroke-opacity=".5"/>
      <path d="M683 137L694 143V156L683 150Z" fill="#133644"/>
      <path d="M694 143L705 137V150L694 156Z" fill="#3C2D5A"/>
      <path d="M683 137L694 131L705 137L694 143Z" fill="#302849" stroke="#C4ABFF" stroke-opacity=".5"/>
    </g>
    <g class="signal">
      <circle cx="680" cy="180" r="2.5" fill="#79F1ED"/>
      <circle cx="962" cy="92" r="2.5" fill="#79F1ED"/>
      <circle cx="970" cy="249" r="2.5" fill="#C4ABFF"/>
      <circle cx="706" cy="256" r="2.5" fill="#C4ABFF"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="308" rx="19" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
